<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>preview de poses na cama</title>
<style>body{margin:0;background:#101215}canvas{display:block}pre{color:#8f8;font:12px monospace;margin:6px}</style>
</head>
<body>
<pre id="dbg">?pose=normal|spread|legsUp|scissors|bridge|curl — preview das poses do Smoll na cama (ver src/smollAnim.ts)</pre>
<script type="module">
import * as THREE from 'three'
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
import { buildRig } from '/src/rig.ts'
import { bedPose, BED_POSES } from '/src/smollAnim.ts'

const pose = new URLSearchParams(location.search).get('pose') || 'normal'
const W = 1000, H = 700
const renderer = new THREE.WebGLRenderer({ antialias: true })
renderer.setSize(W, H); renderer.setPixelRatio(1)
document.body.appendChild(renderer.domElement)

const S = 1.75 / 1.99
const gltf = await new GLTFLoader().loadAsync('/models/smoll_real_hq.glb')
let src
gltf.scene.traverse((o) => { if (!src && o.isMesh) src = o })
src.geometry.computeVertexNormals()

// igual ao smoll.ts: o grupo gira 90° em z pra deitar, o holder gira 90° em y pra ele ficar de frente
const scene = () => {
  const s = new THREE.Scene(); s.background = new THREE.Color(0x101215)
  s.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2))
  const key = new THREE.DirectionalLight(0xffffff, 1.4); key.position.set(3, 6, 8); s.add(key)
  const rig = buildRig(src.geometry, new THREE.MeshLambertMaterial({ color: 0xb98a63 }))
  const M = new THREE.Group(); M.position.set(0, 0.84, 0); M.rotation.set(0, 0, Math.PI / 2)
  const holder = new THREE.Group(); holder.rotation.y = Math.PI / 2; M.add(holder)
  const mw = new THREE.Group(); mw.scale.setScalar(S); mw.position.y = 0.999 * S; mw.add(rig.mesh); holder.add(mw)
  rig.apply(bedPose(1, 1, pose))
  s.add(M)
  const bed = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.3, 1.8), new THREE.MeshLambertMaterial({ color: 0x3d5a80 }))
  bed.position.set(-0.88, 0.5, 0); s.add(bed) // o corpo todo fica entre x -1,76 e 0
  s.updateMatrixWorld(true)
  return { s, rig }
}

const a = scene()
const bb = new THREE.Box3().setFromObject(a.rig.mesh)
document.getElementById('dbg').textContent = pose + ' bbox ' + JSON.stringify({ min: bb.min.toArray().map((v) => +v.toFixed(2)), max: bb.max.toArray().map((v) => +v.toFixed(2)) }) + ' | ' + BED_POSES.join(', ')

const side = new THREE.PerspectiveCamera(45, 0.85, 0.1, 100)
side.position.set(-0.9, 1.4, 3.6); side.lookAt(-0.9, 0.7, 0)
const end = new THREE.PerspectiveCamera(45, 0.85, 0.1, 100)
end.position.set(1.4, 1.3, 0.8); end.lookAt(-0.9, 0.7, 0)

renderer.setViewport(0, 0, W / 2, H); renderer.setScissor(0, 0, W / 2, H); renderer.setScissorTest(true)
renderer.render(a.s, side)
const b = scene()
renderer.setViewport(W / 2, 0, W / 2, H); renderer.setScissor(W / 2, 0, W / 2, H)
renderer.render(b.s, end)
</script>
</body>
</html>
